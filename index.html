<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مؤشر حملة شنطة رمضان</title>
<style>
  :root {
    --primary-color: #2e7d32;
    --secondary-color: #f57c00;
    --messenger-blue: #0084ff;
  }
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background-color: #f4f4f4; 
    margin: 0; 
    padding: 15px; /* قللت الهوامش شوية للموبايل */
    display: flex; 
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
  }
  .main-card {
    background: white;
    width: 100%;
    max-width: 100%; /* شلت القيد على العرض عشان يملى الشاشة */
    border-radius: 20px;
    padding: 30px 20px; /* كبرت الـ padding الداخلي */
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    border-top: 10px solid var(--primary-color);
    box-sizing: border-box;
  }
  .header { text-align: center; margin-bottom: 35px; }
  .header h1 { color: var(--primary-color); margin: 0; font-size: 28px; /* تكبير العنوان */ font-weight: 800; }
  .header p { color: #555; margin-top: 10px; font-size: 16px; /* تكبير النص الفرعي */ }

  /* تنسيق العدادات */
  .progress-section { margin-bottom: 35px; }
  .label-group { display: flex; justify-content: space-between; margin-bottom: 12px; font-weight: bold; font-size: 16px; /* تكبير العناوين */ }
  .target-label { color: #777; font-weight: normal; font-size: 14px; }
  
  .progress-bg { 
    background: #e0e0e0; 
    border-radius: 50px; 
    height: 35px; /* تكبير ارتفاع العداد */
    width: 100%; 
    overflow: hidden; 
    position: relative;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
  }
  .progress-fill { 
    height: 100%; 
    border-radius: 50px; 
    transition: width 1.5s cubic-bezier(0.1, 0, 0.2, 1); 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    color: white; 
    font-size: 14px; /* تكبير نسبة الإنجاز داخل العداد */
    font-weight: bold;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
  }
  .fill-money { background: linear-gradient(90deg, #4caf50, #2e7d32); }
  .fill-bags { background: linear-gradient(90deg, #ff9800, #f57c00); }

  .current-stats { font-size: 18px; /* تكبير رقم المحصل */ margin-top: 12px; font-weight: bold; }
  
  /* Loading Spinner */
  .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-color); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 30px auto; display: block; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  .btn-messenger {
    display: flex; align-items: center; justify-content: center;
    background-color: var(--messenger-blue); color: white; text-decoration: none;
    padding: 16px; /* تكبير الزر */
    border-radius: 15px; font-weight: bold; font-size: 18px; /* تكبير خط الزر */
    margin-top: 25px;
    transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0, 132, 255, 0.4);
  }
  .btn-messenger:hover { background-color: #0073e6; transform: translateY(-3px); }
  .messenger-icon { margin-left: 12px; width: 26px; filter: brightness(0) invert(1); }
  .footer-info { text-align: center; margin-top: 25px; font-size: 0.9rem; color: #999; border-top: 1px solid #eee; padding-top: 20px; }
</style>
</head>
<body>

<div class="main-card" id="card-content">
  <div class="header">
    <h1>🌙 حملة شنطة رمضان 2026</h1>
    <p>جمعية عائلتي مصر الخيرية (فرع بنها وقنا)</p>
  </div>
  
  <div id="loading-spinner" class="loader"></div>

  <div id="dashboard" style="display:none;">
      <div class="progress-section">
        <div class="label-group">
          <span>💰 إجمالي التبرعات المالية</span>
          <span class="target-label">الهدف: <span id="lbl-target-money">...</span> ج.م</span>
        </div>
        <div class="progress-bg">
          <div id="bar-money" class="progress-fill fill-money" style="width: 0%;">0%</div>
        </div>
        <div class="current-stats" style="color: var(--primary-color);">
          تم جمع: <span id="txt-money">0</span> ج.م
        </div>
      </div>

      <div class="progress-section">
        <div class="label-group">
          <span>📦 عدد الشنط المكتملة</span>
          <span class="target-label">الهدف: <span id="lbl-target-bags">...</span> شنطة</span>
        </div>
        <div class="progress-bg">
          <div id="bar-bags" class="progress-fill fill-bags" style="width: 0%;">0%</div>
        </div>
        <div class="current-stats" style="color: var(--secondary-color);">
          تم تجهيز: <span id="txt-bags">0</span> شنطة
        </div>
      </div>

      <a href="https://m.me/a2elaty" class="btn-messenger" target="_blank">
        تواصل معنا عبر ماسينجر للتفاصيل
        <img class="messenger-icon" src="https://upload.wikimedia.org/wikipedia/commons/b/be/Facebook_Messenger_logo_2020.svg" alt="messenger">
      </a>
  </div>

  <div class="footer-info">
    📍 بنها - قنا | شارك في الخير ولو بشنطة واحدة
  </div>
</div>

<script>
  // ============================================================
  // ضع رابط ملف الـ CSV هنا بين علامتي التنصيص
  const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSQnUkTf-4CS0pZVV5sehLY_XHVv_bA4zOEyYjzTRRKOctpLyhiQMfdJp10HN-vvKy0PlAhm1GeQRJi/pub?gid=0&single=true&output=csv"; 
  // ============================================================

  fetch(sheetUrl)
    .then(response => response.text())
    .then(csvText => {
      // تنظيف البيانات وقراءتها
      const rows = csvText.split('\n');
      const data = rows[0].split(',');

      // تنظيف الأرقام
      const collectedMoney = parseFloat(data[0].replace(/["\s]/g, ''));
      const targetMoney = parseFloat(data[1].replace(/["\s]/g, ''));
      const bagPrice = parseFloat(data[2].replace(/["\s]/g, ''));

      // الحسابات
      const bagsCollected = Math.floor(collectedMoney / bagPrice);
      const bagsTarget = Math.floor(targetMoney / bagPrice);
      
      const moneyPercent = ((collectedMoney / targetMoney) * 100).toFixed(1);
      
      // تحديث الواجهة
      document.getElementById('lbl-target-money').innerText = targetMoney.toLocaleString();
      document.getElementById('lbl-target-bags').innerText = bagsTarget.toLocaleString();
      document.getElementById('txt-money').innerText = collectedMoney.toLocaleString();
      document.getElementById('txt-bags').innerText = bagsCollected.toLocaleString();

      // إظهار المحتوى وإخفاء التحميل
      document.getElementById('loading-spinner').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';

      // تحريك البار
      setTimeout(() => {
        document.getElementById('bar-money').style.width = moneyPercent + '%';
        document.getElementById('bar-money').innerText = moneyPercent + '%';
        document.getElementById('bar-bags').style.width = moneyPercent + '%'; 
        document.getElementById('bar-bags').innerText = moneyPercent + '%';
      }, 100);

    })
    .catch(error => {
      console.error('Error fetching data:', error);
      document.getElementById('loading-spinner').style.display = 'none';
      document.querySelector('.header').insertAdjacentHTML('beforeend', '<p style="color:red">عذراً، حدث خطأ في تحميل البيانات.</p>');
    });
</script>

</body>
</html>
